<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RecipeJS - Filter & Sort</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🍽 RecipeJS App</h1>

  <!-- Filter Section -->
  <div class="controls">
    <h2>Filter Recipes</h2>
    <button id="filter-all">All Recipes</button>
    <button id="filter-easy">Easy</button>
    <button id="filter-medium">Medium</button>
    <button id="filter-hard">Hard</button>
    <button id="filter-quick">Quick (< 30 mins)</button>
  </div>

  <!-- Sort Section -->
  <div class="controls">
    <h2>Sort Recipes</h2>
    <button id="sort-name">Name (A–Z)</button>
    <button id="sort-time">Time (Fastest First)</button>
  </div>

  <!-- Recipes Display -->
  <div id="recipe-container" class="recipe-container"></div>

  <script src="script.js"></script>
</body>
</html>
